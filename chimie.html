<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pauline — 5 exercices guidés de chimie</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17253b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:18px}
main{max-width:760px;margin:auto}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 3px 16px #17253b12}
h1{font-size:1.6rem}h2{font-size:1.3rem}p,li{line-height:1.55}.muted{color:#50617b}
button{font:inherit;cursor:pointer;border:1px solid #b7c5d9;border-radius:12px;padding:13px 15px;background:white;color:#17253b}
button.primary{background:#234f98;color:white;border-color:#234f98;font-weight:700}
button:disabled{opacity:.5;cursor:default}.answers{display:grid;gap:10px;margin:18px 0}.answers button{text-align:left;width:100%}
.answers button.selected{border:2px solid #234f98;background:#edf4ff}.feedback{padding:13px;border-radius:10px;background:#f0f4fa;margin:12px 0}
.good{background:#e9f7ef}.bad{background:#fff1ed}.bar{height:9px;background:#e0e8f2;border-radius:9px;overflow:hidden}
.bar>div{height:100%;background:#3568b3;transition:width .2s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media(max-width:480px){body{padding:10px}.card{padding:17px}}
</style></head><body><main><div id="app"></div></main>
<script>
const exercises=[{"title": "Acide faible : retrouver le taux d’avancement", "goal": "Déterminer le taux d’avancement final τ.", "data": ["AH + H₂O ⇌ A⁻ + H₃O⁺", "Volume V = 100 mL = 0,100 L", "Concentration initiale en AH : C₀ = 0,010 mol·L⁻¹", "pH à l’équilibre = 3,0", "On néglige les ions H₃O⁺ initialement présents."], "qs": [["Quelle est la concentration [H₃O⁺] à l’équilibre ?", ["10⁻³ mol·L⁻¹", "3 mol·L⁻¹", "10³ mol·L⁻¹", "10⁻¹ mol·L⁻¹"], 0, "[H₃O⁺] = 10⁻ᵖᴴ = 10⁻³ mol·L⁻¹."], ["Quelle quantité de H₃O⁺ a été formée ?", ["0,10 mol", "1,0 × 10⁻⁴ mol", "1,0 × 10⁻³ mol", "1,0 × 10⁻⁵ mol"], 1, "n = C × V = 10⁻³ × 0,100 = 1,0 × 10⁻⁴ mol."], ["Quel est l’avancement final xᶠ ?", ["1,0 × 10⁻⁴ mol", "1,0 × 10⁻³ mol", "0,10 mol", "1,0 × 10⁻⁵ mol"], 0, "Le coefficient de H₃O⁺ est 1 : xᶠ = n(H₃O⁺) formé = 1,0 × 10⁻⁴ mol."], ["Quelle quantité initiale n₀(AH) a été introduite ?", ["0,10 mol", "1,0 × 10⁻⁴ mol", "1,0 × 10⁻³ mol", "0,010 mol"], 2, "n₀ = C₀ × V = 0,010 × 0,100 = 1,0 × 10⁻³ mol."], ["Quel est l’avancement maximal xₘₐₓ ?", ["1,0 × 10⁻⁴ mol", "1,0 × 10⁻³ mol", "1,0 × 10⁻² mol", "1,0 mol"], 1, "L’eau est en grand excès ; AH est limitant, donc xₘₐₓ = n₀(AH) = 1,0 × 10⁻³ mol."], ["Quel est le taux final τ et que signifie-t-il ?", ["τ = 1 : totale", "τ = 0,01 : non totale", "τ = 0,10 : non totale", "τ = 10 : totale"], 2, "τ = xᶠ/xₘₐₓ = 10⁻⁴/10⁻³ = 0,10, soit 10 %. La transformation est non totale."]]}, {"title": "Acide faible : déterminer Kₐ puis pKₐ", "goal": "Calculer Kₐ et pKₐ à l’équilibre.", "data": ["AH + H₂O ⇌ A⁻ + H₃O⁺", "V = 1,0 L", "n₀(AH) = 0,010 mol", "pH mesuré = 3,0", "[H₃O⁺] initial négligeable ; c° = 1 mol·L⁻¹."], "qs": [["Quelle est [H₃O⁺] à l’équilibre ?", ["10⁻³ mol·L⁻¹", "10⁻² mol·L⁻¹", "3 × 10⁻³ mol·L⁻¹", "10³ mol·L⁻¹"], 0, "pH = 3, donc [H₃O⁺] = 10⁻³ mol·L⁻¹."], ["Quel est xᶠ ?", ["0,010 mol", "0,0010 mol", "0,10 mol", "0,00010 mol"], 1, "xᶠ = [H₃O⁺] × V = 0,0010 × 1,0 = 0,0010 mol."], ["Quelle est la quantité finale de AH ?", ["0,011 mol", "0,001 mol", "0,009 mol", "0 mol"], 2, "nᶠ(AH) = n₀ − xᶠ = 0,010 − 0,001 = 0,009 mol."], ["Quelles sont [A⁻] et [AH] à l’équilibre ?", ["0,009 et 0,001 mol·L⁻¹", "0,001 et 0,009 mol·L⁻¹", "0,010 et 0,010 mol·L⁻¹", "0,001 et 0,010 mol·L⁻¹"], 1, "[A⁻] = xᶠ/V = 0,001 mol·L⁻¹ et [AH] = 0,009/1 = 0,009 mol·L⁻¹."], ["Quelle expression et valeur de Kₐ sont correctes ?", ["Kₐ = 0,009/(0,001 × 0,001) = 9000", "Kₐ = 0,001/0,009 ≈ 0,11", "Kₐ = (0,001 × 0,001)/0,009 ≈ 1,1 × 10⁻⁴", "Kₐ = 0,009/(0,001) ≈ 9"], 2, "Kₐ = ([A⁻]/c°)([H₃O⁺]/c°)/([AH]/c°) ≈ 1,1 × 10⁻⁴."], ["Quel pKₐ obtient-on approximativement (calculatrice autorisée) ?", ["3,0", "4,0", "9,0", "1,1"], 1, "pKₐ = −log(Kₐ) ≈ −log(1,1 × 10⁻⁴) ≈ 3,96, donc environ 4,0."]]}, {"title": "Base faible : retrouver le pH", "goal": "Calculer le pH à partir d’un avancement final.", "data": ["NH₃ + H₂O ⇌ NH₄⁺ + HO⁻", "V = 0,50 L", "n₀(NH₃) = 0,010 mol", "xᶠ = 5,0 × 10⁻⁴ mol", "À 25 °C : Kₑ = 10⁻¹⁴ ; on néglige HO⁻ initial."], "qs": [["Quel est le coefficient stœchiométrique de HO⁻ ?", ["2", "1", "0", "3"], 1, "Une mole de HO⁻ est formée pour une mole d’avancement."], ["Quelle quantité finale de HO⁻ a été formée ?", ["0,010 mol", "0,005 mol", "5,0 × 10⁻⁴ mol", "2,5 × 10⁻⁴ mol"], 2, "n(HO⁻) formé = xᶠ = 5,0 × 10⁻⁴ mol."], ["Quelle est la concentration [HO⁻] finale ?", ["1,0 × 10⁻³ mol·L⁻¹", "2,5 × 10⁻⁴ mol·L⁻¹", "5,0 × 10⁻⁴ mol·L⁻¹", "1,0 × 10⁻² mol·L⁻¹"], 0, "[HO⁻] = 5,0 × 10⁻⁴/0,50 = 1,0 × 10⁻³ mol·L⁻¹."], ["Quelle est [H₃O⁺] à l’équilibre ?", ["10⁻³ mol·L⁻¹", "10⁻¹⁴ mol·L⁻¹", "10⁻⁷ mol·L⁻¹", "10⁻¹¹ mol·L⁻¹"], 3, "Kₑ = ([H₃O⁺]/c°)([HO⁻]/c°) ; [H₃O⁺] = 10⁻¹⁴/10⁻³ = 10⁻¹¹ mol·L⁻¹."], ["Quel est le pH final ?", ["3", "7", "11", "14"], 2, "pH = −log(10⁻¹¹) = 11."], ["Quel est le taux d’avancement final de la réaction ?", ["0,05", "0,50", "0,005", "0,10"], 0, "xₘₐₓ = n₀(NH₃) = 0,010 mol ; τ = 0,00050/0,010 = 0,05, soit 5 %."]]}, {"title": "Quotient de réaction : prévoir l’évolution", "goal": "Déterminer le sens d’évolution spontané et l’état d’équilibre.", "data": ["Réaction : AH + B ⇌ A⁻ + BH⁺", "À la température considérée : K = 4,0", "État initial : [AH] = 0,20 mol·L⁻¹ ; [B] = 0,20 mol·L⁻¹", "[A⁻] = 0,10 mol·L⁻¹ ; [BH⁺] = 0,10 mol·L⁻¹", "Toutes les espèces sont dissoutes dans une solution diluée ; c° = 1 mol·L⁻¹."], "qs": [["Quelle expression donne Qᵣ ?", ["[AH][B]/([A⁻][BH⁺])", "[A⁻][BH⁺]/([AH][B])", "[A⁻]/[AH]", "[BH⁺]/[B]"], 1, "Les activités des produits figurent au numérateur et celles des réactifs au dénominateur ; les c° se simplifient ici."], ["Quelle est la valeur initiale de Qᵣ ?", ["4,0", "2,0", "0,25", "0,50"], 2, "Qᵣ = (0,10 × 0,10)/(0,20 × 0,20) = 0,25."], ["Comment Qᵣ se compare-t-il à K ?", ["Qᵣ < K", "Qᵣ = K", "Qᵣ > K", "Impossible à savoir"], 0, "0,25 < 4,0."], ["Dans quel sens la réaction évolue-t-elle spontanément ?", ["Sens inverse", "Sens direct", "Aucun sens : équilibre", "Les deux sens à vitesse égale dès le départ"], 1, "Quand Qᵣ < K, l’évolution nette spontanée se fait vers les produits."], ["Pendant cette évolution nette, que deviennent les concentrations ?", ["AH et B augmentent", "Toutes restent constantes", "A⁻ et BH⁺ augmentent", "Toutes diminuent"], 2, "Dans le sens direct, les réactifs AH et B sont consommés tandis que A⁻ et BH⁺ se forment."], ["Quelle condition caractérise l’équilibre final ?", ["Qᵣ = 0", "Qᵣ = 0,25", "Qᵣ > 4", "Qᵣ = 4,0"], 3, "À l’équilibre, Qᵣ,éq = K = 4,0 ; les réactions directe et inverse continuent à vitesse égale."]]}, {"title": "Prédominance : retrouver le rapport des espèces", "goal": "Calculer le rapport [A⁻]/[AH] et reconnaître l’espèce prédominante.", "data": ["Couple AH/A⁻ ; pKₐ = 5,0", "pH de la solution = 6,0", "Relation : pH = pKₐ + log([A⁻]/[AH])", "Concentrations à l’équilibre : [AH] = 0,002 mol·L⁻¹", "On suppose la relation applicable à cette solution."], "qs": [["Quelle différence pH − pKₐ faut-il utiliser ?", ["−1", "0", "+1", "+11"], 2, "6,0 − 5,0 = +1."], ["Quelle valeur prend log([A⁻]/[AH]) ?", ["−1", "1", "5", "6"], 1, "En isolant le logarithme, on trouve pH − pKₐ = 1."], ["Quel est le rapport [A⁻]/[AH] ?", ["0,1", "1", "5", "10"], 3, "Si log(r) = 1, alors r = 10¹ = 10."], ["Quelle est la concentration [A⁻] ?", ["0,020 mol·L⁻¹", "0,0002 mol·L⁻¹", "0,002 mol·L⁻¹", "0,20 mol·L⁻¹"], 0, "[A⁻] = 10 × [AH] = 10 × 0,002 = 0,020 mol·L⁻¹."], ["Quelle espèce prédomine ?", ["AH", "A⁻", "Les deux à égalité", "Aucune espèce"], 1, "Comme [A⁻] = 10[AH], la forme basique A⁻ prédomine."], ["Si le pH devenait 5,0, quel serait le rapport [A⁻]/[AH] ?", ["10", "0,1", "1", "100"], 2, "À pH = pKₐ, log([A⁻]/[AH]) = 0, donc le rapport vaut 1."]]}];
let ei=0, qi=-1, selected=null, validated=false, answers={}, score=0;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(i,j)=>i+'-'+j;
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function render(){
app.innerHTML='';
const e=exercises[ei];
if(ei>=exercises.length){return results()}
let header=document.createElement('div');header.className='card';
header.innerHTML='<h1>🧪 Chimie — exercices guidés</h1><p class="muted">Exercice '+(ei+1)+'/5 · '+(qi<0?'Données à noter':'Question '+(qi+1)+'/6')+' · '+score+'/30 bonnes réponses</p><div class="bar"><div style="width:'+((ei*6+Math.max(0,qi))/30*100)+'%"></div></div>';
app.append(header);
let card=document.createElement('section');card.className='card';app.append(card);
if(qi<0){
card.innerHTML='<h2>'+esc(e.title)+'</h2><p><strong>Objectif final :</strong> '+esc(e.goal)+'</p><p><strong>Avant de commencer, recopie sur une feuille toutes ces données :</strong></p><ul>'+e.data.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="muted">Garde ta feuille et ta calculatrice : les 6 questions utilisent les mêmes données. Tu peux prendre ton temps. Les données sont rappelées dans chaque question.</p>';
card.append(btn('Commencer les 6 QCM →',()=>{qi=0;selected=null;validated=false;render()},'primary'));return;
}
const q=e.qs[qi];
card.innerHTML='<h2>'+esc(e.title)+'</h2><details><summary>📋 Revoir les données de l’exercice</summary><ul>'+e.data.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details><h3>Question '+(qi+1)+' — '+esc(q[0])+'</h3>';
const options=document.createElement('div');options.className='answers';card.append(options);
q[1].forEach((o,k)=>{let b=btn('ABCD'[k]+'. '+o,()=>{if(validated)return;selected=k;render()},selected===k?'selected':'');b.disabled=validated;options.append(b)});
if(validated){
let correct=selected===q[2];let f=document.createElement('div');f.className='feedback '+(correct?'good':'bad');
f.innerHTML='<strong>'+(correct?'✓ Bonne réponse !':'✗ Réponse attendue : '+esc('ABCD'[q[2]]+'. '+q[1][q[2]]))+'</strong><p>'+esc(q[3])+'</p>';card.append(f);
card.append(btn(qi===5?(ei===4?'Voir mon bilan →':'Passer à l’exercice suivant →'):'Question suivante →',()=>{if(qi===5){ei++;qi=-1}else qi++;selected=null;validated=false;render()},'primary'));
}else{
let b=btn('Valider ma réponse',()=>{if(selected===null)return;validated=true;answers[key(ei,qi)]=selected;if(selected===q[2])score++;render()},'primary');b.disabled=selected===null;card.append(b);
}
}
function results(){
app.innerHTML='<div class="card"><h1>🎉 Bilan des 5 exercices</h1><p><strong>Score : '+score+'/30</strong> — '+Math.round(score/30*100)+' %</p><p>Tu as travaillé les avancements, Kₐ/pKₐ, le pH, Qᵣ et la prédominance. Relis les corrections des questions ratées pour repérer les étapes à revoir.</p></div>';
exercises.forEach((e,i)=>{let n=e.qs.filter((q,j)=>answers[key(i,j)]===q[2]).length;let c=document.createElement('div');c.className='card';c.innerHTML='<h2>'+esc(e.title)+' : '+n+'/6</h2>'+e.qs.map((q,j)=>'<details><summary>Question '+(j+1)+' : '+(answers[key(i,j)]===q[2]?'✓':'✗')+' '+esc(q[0])+'</summary><p>Ta réponse : '+esc(q[1][answers[key(i,j)]])+'</p><p>Bonne réponse : '+esc(q[1][q[2]])+'</p><p>'+esc(q[3])+'</p></details>').join('');app.append(c)});
let c=document.createElement('div');c.className='card';c.append(btn('Recommencer le quiz',()=>{ei=0;qi=-1;selected=null;validated=false;answers={};score=0;render()},'primary'));app.append(c);
}
render();
</script></body></html>
