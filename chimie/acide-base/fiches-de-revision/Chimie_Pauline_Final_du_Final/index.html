:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1b3049;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:18px 12px}main{max-width:920px;margin:auto}h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.17;margin:.35em 0}h2{font-size:1.29rem;margin:0 0 12px}h3{font-size:1.08rem;line-height:1.4}p,li{line-height:1.58}.muted{color:#5d7187}.tiny{font-size:.86rem}.strong{font-weight:750}.card{background:white;border:1px solid #e1e9f2;border-radius:19px;padding:23px;margin:17px 0;box-shadow:0 4px 22px #1327460b}.hero{background:linear-gradient(110deg,#f1f7fe,#fff8f8);border-color:#ccdeee}.tag{display:inline-block;font-weight:750;background:#eaf3fd;color:#1d527d;border-radius:100px;padding:6px 11px;font-size:.8rem}.intro{font-size:1.05rem}.line{border:0;border-top:1px solid #dce7f0;margin:22px 0}.big-button,button{font:inherit;cursor:pointer;border:1px solid #bacddd;border-radius:12px;padding:12px 15px;background:#fff;color:#203b55;text-align:center}button:hover:not(:disabled){border-color:#4385ae;background:#f1f9fe}button.primary{background:#156399;color:#fff;border-color:#156399;font-weight:750}button.primary:hover:not(:disabled){background:#0d507f;color:#fff}button:disabled{opacity:.52;cursor:default}button.selected{outline:2px solid #12649d;background:#e9f5fd;border-color:#12649d}button.choice{text-align:left;min-height:58px}.choices{display:grid;gap:10px;margin:20px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.actions>*{flex:1 1 180px}.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid #cddde9;border-radius:15px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:9px;text-align:left}.tile span{color:#63778d;font-size:.88rem;line-height:1.35}.tile strong{font-size:1.06rem}.tile:hover{background:#f2f9ff}ul{padding-left:1.35rem}details{border:1px solid #d8e4ed;border-radius:12px;background:#f9fcff;padding:12px 15px;margin:15px 0}summary{cursor:pointer;font-weight:680}.feedback{padding:18px;border-radius:14px;border:1px solid #d7e6dd;margin:15px 0}.feedback.correct{background:#eff9f4;border-color:#a6d8ba}.feedback.incorrect{background:#fff4f0;border-color:#f5cfbb}.feedback p{margin:10px 0 0}.bar{height:12px;background:#dae5ee;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#1c7cb5,#49aa93);transition:width .25s}.data-banner{border-left:4px solid #1c75a7;background:#eef7fc;padding:12px 15px;border-radius:10px}.diagram{max-width:100%;border:1px solid #d7e4ef;background:#fbfdff;border-radius:14px;padding:9px;margin:18px 0}.diagram svg{display:block;width:100%;height:auto}.legend{color:#60778d;font-size:.81rem;margin:5px 6px}.hint{font-size:.94rem;color:#355e7a}.hint-button{padding:9px 12px;font-size:.91rem}.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:13px 0}.steps div{font-size:.73rem;padding:7px 3px;border-radius:7px;background:#edf4f9;text-align:center;color:#57738c}.steps div.active{background:#d4edf9;color:#145c87;font-weight:750}.progress-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.footer{text-align:center;color:#6e8191;font-size:.83rem;padding:24px}.answerlist details{margin:9px 0}.scoreline{padding:10px 0;border-bottom:1px solid #e4edf4}.num{font-variant-numeric:tabular-nums}.method{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.method span{padding:9px 4px;border-radius:8px;background:#e8f3fb;color:#235c81;text-align:center;font-size:.78rem;font-weight:700}a{color:#1b6a9f}.small{font-size:.91rem}

'use strict';
const exercises=[{"title": "Exercice 1 — Un acide faible dans une boisson", "subtitle": "De la mesure du pH à un tampon : reconstruire toute l’étude.", "context": "Dans une boisson, on étudie un acide faible monoprotique noté AH. Dans ce modèle simplifié, la solution ne contient initialement que AH dans l’eau. Les valeurs sont choisies pour faciliter les calculs du raisonnement type bac.", "data": ["Concentration initiale : C = 0,0100 mol·L⁻¹ ; volume : V = 100 mL = 0,100 L.", "pH mesuré à l’équilibre : 3,00. On néglige les ions oxonium apportés initialement par l’eau.", "Réaction étudiée : AH + H₂O ⇌ A⁻ + H₃O⁺ ; l’eau est en grand excès.", "À 25 °C ; concentration standard c° = 1 mol·L⁻¹. On utilisera la forme simplifiée de Ka avec les concentrations exprimées en mol·L⁻¹.", "Pour une comparaison hors équilibre : [A⁻] = [H₃O⁺] = 3,0 × 10⁻⁴ mol·L⁻¹ et [AH] = 9,7 × 10⁻³ mol·L⁻¹.", "Bleu de bromothymol (BBT) : jaune en dessous de pH 6,0 ; vert dans la zone 6,0–7,6 ; bleu au-dessus de 7,6.", "En fin d’exercice : on prépare un autre mélange contenant n(AH) = n(A⁻) = 0,010 mol, puis on ajoute 0,002 mol de H₃O⁺ (volume supposé constant).", "Aide : log(1,1 × 10⁻⁴) ≈ −3,96 ; log(2/3) ≈ −0,18."], "pka": 3.96, "special": "Pour la distribution, on admet une seule transformation acide/base AH / A⁻. On néglige les effets d’activité et les autres équilibres.", "questions": [{"phase": "A · Départ", "question": "Quelle quantité initiale n₀(AH) a-t-on introduite ?", "options": ["1,0 × 10⁻⁴ mol", "1,0 × 10⁻³ mol", "0,100 mol", "1,0 × 10⁻² mol"], "correct": 1, "explanation": "n₀ = C × V = 0,0100 × 0,100 = 1,0 × 10⁻³ mol. Attention : le volume doit être en litres.", "hint": "Commence par n = C × V."}, {"phase": "A · Départ", "question": "Quelle concentration en ions oxonium correspond au pH mesuré ?", "options": ["3,0 mol·L⁻¹", "10³ mol·L⁻¹", "1,0 × 10⁻³ mol·L⁻¹", "1,0 × 10⁻⁷ mol·L⁻¹"], "correct": 2, "explanation": "[H₃O⁺] ≈ 10⁻ᵖᴴ = 10⁻³ mol·L⁻¹. Il s’agit d’une concentration, non d’une quantité de matière.", "hint": "Exprime [H₃O⁺] en fonction du pH."}, {"phase": "A · Départ", "question": "Dans AH + H₂O ⇌ A⁻ + H₃O⁺, que se passe-t-il ?", "options": ["AH reçoit H⁺", "A⁻ perd H⁺", "AH cède H⁺ à l’eau", "L’eau ne joue aucun rôle"], "correct": 2, "explanation": "AH est l’acide de Brønsted : il cède un proton à H₂O, qui devient H₃O⁺. A⁻ est la base conjuguée de AH.", "hint": "Qui donne le proton H⁺ ?"}, {"phase": "B · Avancement", "question": "Quelle quantité d’ions H₃O⁺ a été formée ?", "options": ["1,0 × 10⁻³ mol", "1,0 × 10⁻⁵ mol", "1,0 × 10⁻⁴ mol", "1,0 × 10⁻² mol"], "correct": 2, "explanation": "n(H₃O⁺) ≈ [H₃O⁺] × V = 10⁻³ × 0,100 = 1,0 × 10⁻⁴ mol.", "hint": "Utilise la concentration et le volume de la solution."}, {"phase": "B · Avancement", "question": "Quel est l’avancement final xᶠ ?", "options": ["1,0 × 10⁻⁴ mol", "1,0 × 10⁻³ mol", "1,0 × 10⁻² mol", "0 mol"], "correct": 0, "explanation": "Le coefficient stœchiométrique de H₃O⁺ vaut 1 ; en négligeant l’oxonium initial, xᶠ = n(H₃O⁺) formé = 1,0 × 10⁻⁴ mol.", "hint": "Relie les coefficients stœchiométriques aux quantités formées."}, {"phase": "B · Avancement", "question": "Quel est xₘₐₓ ?", "options": ["1,0 × 10⁻⁴ mol", "1,0 × 10⁻² mol", "1,0 × 10⁻³ mol", "0,100 mol"], "correct": 2, "explanation": "L’eau étant en excès, AH est limitant : xₘₐₓ = n₀(AH) = 1,0 × 10⁻³ mol.", "hint": "Imagine la consommation totale de AH."}, {"phase": "B · Avancement", "question": "Quel est le taux d’avancement final τ ?", "options": ["τ = 10", "τ = 1", "τ = 0,01", "τ = 0,10"], "correct": 3, "explanation": "τ = xᶠ/xₘₐₓ = 10⁻⁴/10⁻³ = 0,10, soit 10 %. La transformation est non totale.", "hint": "Divise xᶠ par xₘₐₓ."}, {"phase": "B · Avancement", "question": "À l’état final, quelles quantités de AH et de A⁻ trouve-t-on ?", "options": ["n(AH) = 9 × 10⁻⁴ mol ; n(A⁻) = 1 × 10⁻⁴ mol", "n(AH) = 1 × 10⁻⁴ mol ; n(A⁻) = 9 × 10⁻⁴ mol", "n(AH) = 0 ; n(A⁻) = 1 × 10⁻³ mol", "n(AH) = n(A⁻) = 1 × 10⁻³ mol"], "correct": 0, "explanation": "Tableau d’avancement : nᶠ(AH) = n₀ − xᶠ = 0,0010 − 0,00010 = 0,00090 mol ; nᶠ(A⁻) = xᶠ = 0,00010 mol.", "hint": "La quantité d’acide diminue de xᶠ ; celle de base augmente de xᶠ."}, {"phase": "B · Avancement", "question": "Quelles concentrations d’équilibre en déduit-on ?", "options": ["[AH] = 0,001 ; [A⁻] = 0,009 mol·L⁻¹", "[AH] = 0,009 ; [A⁻] = 0,001 mol·L⁻¹", "[AH] = 0,090 ; [A⁻] = 0,010 mol·L⁻¹", "[AH] = 0 ; [A⁻] = 0,010 mol·L⁻¹"], "correct": 1, "explanation": "On divise par V = 0,100 L : [AH] = 9 × 10⁻⁴/0,100 = 9 × 10⁻³ ; [A⁻] = 1 × 10⁻⁴/0,100 = 1 × 10⁻³ mol·L⁻¹.", "hint": "Passe des quantités n aux concentrations n/V."}, {"phase": "C · Équilibre", "question": "Quelle expression du quotient de réaction Qᵣ est correcte (notation simplifiée) ?", "options": ["[AH]/([A⁻] × [H₃O⁺])", "[A⁻] × [H₃O⁺]/[AH]", "[A⁻]/[AH]", "[H₂O] × [AH]"], "correct": 1, "explanation": "L’eau est le solvant, son activité vaut 1. Qᵣ = (a(A⁻) × a(H₃O⁺))/a(AH), soit la forme simplifiée indiquée ; la concentration standard c° est sous-entendue pour obtenir un quotient sans dimension.", "hint": "Les activités des produits se placent au numérateur."}, {"phase": "C · Équilibre", "question": "Pour l’état hors équilibre fourni, Qᵣ vaut environ…", "options": ["9,3 × 10⁻⁶", "1,1 × 10⁻⁴", "9,7 × 10⁻³", "3,0 × 10⁻⁴"], "correct": 0, "explanation": "Qᵣ ≈ (3,0 × 10⁻⁴)²/(9,7 × 10⁻³) ≈ 9,3 × 10⁻⁶ (avec c° = 1 mol·L⁻¹ sous-entendu).", "hint": "Évalue le produit des deux concentrations au numérateur."}, {"phase": "C · Équilibre", "question": "Si Ka vaut environ 1,1 × 10⁻⁴, comment cet état évolue-t-il ?", "options": ["Sens inverse, vers AH", "Il ne se passe rien", "Sens direct, vers A⁻ et H₃O⁺", "Impossible à prévoir"], "correct": 2, "explanation": "9,3 × 10⁻⁶ < 1,1 × 10⁻⁴ : Qᵣ < Ka. L’évolution nette spontanée se fait dans le sens direct jusqu’à l’équilibre.", "hint": "Compare Qᵣ à K (ici K = Ka)."}, {"phase": "C · Équilibre", "question": "À partir des concentrations à l’équilibre, calcule Ka.", "options": ["1,1 × 10⁻⁴", "1,1 × 10⁴", "9,0", "1,0 × 10⁻³"], "correct": 0, "explanation": "Ka ≈ ([A⁻] × [H₃O⁺])/[AH] = (0,001 × 0,001)/0,009 = 1,11 × 10⁻⁴, en notation simplifiée pour c° = 1 mol·L⁻¹.", "hint": "Utilise les concentrations de la question 9."}, {"phase": "C · Équilibre", "question": "Quel pKa déduit-on de Ka ?", "options": ["pKa ≈ 3,0", "pKa ≈ 4,0", "pKa ≈ 7,0", "pKa ≈ 10,0"], "correct": 1, "explanation": "pKa = −log(Ka) = −log(1,1 × 10⁻⁴) ≈ 3,96 ≈ 4,0. Plus le pKa est petit, plus l’acide est fort (à solvant fixé).", "hint": "pKa est l’opposé du logarithme décimal de Ka."}, {"phase": "D · Diagrammes", "question": "À pH = 3,0, quelle forme prédomine ?", "options": ["A⁻, parce que pH < pKa", "AH, parce que pH < pKa", "AH et A⁻ à égalité", "Aucune"], "correct": 1, "explanation": "3,0 < 3,96 : sur le diagramme de prédominance, la forme acide AH domine. Cela concorde avec [AH] = 0,009 > [A⁻] = 0,001.", "hint": "Place le pH de la solution à gauche ou à droite du pKa."}, {"phase": "D · Diagrammes", "question": "À pH ≈ pKa, que montrerait le diagramme de distribution ?", "options": ["100 % de AH", "100 % de A⁻", "50 % de AH et 50 % de A⁻", "0 % des deux"], "correct": 2, "explanation": "Au croisement des deux courbes, pH = pKa et [AH] = [A⁻] : chacune représente 50 % du total.", "hint": "Observe le croisement des deux courbes."}, {"phase": "D · Diagrammes", "question": "Avec le bleu de bromothymol, quelle couleur observe-t-on dans la solution de pH 3,0 ?", "options": ["Bleue", "Rose", "Verte", "Jaune"], "correct": 3, "explanation": "pH 3,0 est sous la zone de virage du BBT (6,0–7,6) : sa forme acide, jaune, prédomine.", "hint": "Compare pH et les limites de la zone de virage du BBT."}, {"phase": "E · Tampon", "question": "Dans le mélange final ayant 0,010 mol de AH et 0,010 mol de A⁻, quel est le pH initial ?", "options": ["pH ≈ 3,0", "pH ≈ 4,0", "pH ≈ 7,0", "pH ≈ 10,0"], "correct": 1, "explanation": "Avec [A⁻]/[AH] = 1, la relation pH = pKa + log([A⁻]/[AH]) donne pH = pKa ≈ 4,0.", "hint": "Le logarithme de 1 vaut 0."}, {"phase": "E · Tampon", "question": "Après ajout de 0,002 mol de H₃O⁺, quelles quantités restera-t-il ?", "options": ["AH = 0,008 ; A⁻ = 0,012 mol", "AH = A⁻ = 0,010 mol", "AH = 0,012 ; A⁻ = 0,008 mol", "AH = 0,012 ; A⁻ = 0,012 mol"], "correct": 2, "explanation": "La base A⁻ capte H₃O⁺ : A⁻ + H₃O⁺ → AH + H₂O. Il reste 0,010 − 0,002 = 0,008 mol de A⁻ et il se forme 0,010 + 0,002 = 0,012 mol de AH.", "hint": "Quelle espèce consomme les ions oxonium ajoutés ?"}, {"phase": "E · Tampon", "question": "Avec log(2/3) ≈ −0,18, quel pH final trouve-t-on ?", "options": ["pH ≈ 2,0", "pH ≈ 3,82 : petite baisse", "pH ≈ 4,82 : hausse", "pH = 7,0"], "correct": 1, "explanation": "pH ≈ 4,00 + log(0,008/0,012) = 4,00 + log(2/3) ≈ 3,82. La baisse n’est que d’environ 0,18 : effet tampon.", "hint": "Le rapport de concentrations vaut 0,008/0,012 = 2/3."}]}, {"title": "Exercice 2 — Le couple ammonium / ammoniac", "subtitle": "Étudier un acide très faible, lire son diagramme, fabriquer un tampon.", "context": "Au laboratoire, on étudie d’abord une solution d’ions ammonium NH₄⁺, puis un mélange tampon NH₄⁺/NH₃. On simplifie les activités en assimilant les solutions à des solutions diluées.", "data": ["Solution initiale : NH₄⁺/NH₃ ; concentration C = 0,100 mol·L⁻¹ ; volume V = 0,500 L ; pH mesuré = 5,10.", "Réaction étudiée : NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺ ; on néglige l’oxonium initial de l’eau.", "10⁻⁵·¹⁰ ≈ 7,9 × 10⁻⁶ ; (7,9 × 10⁻⁶)² ≈ 6,2 × 10⁻¹¹ ; −log(6,3 × 10⁻¹⁰) ≈ 9,2.", "Un état hors équilibre a [NH₃] = [H₃O⁺] = 4,0 × 10⁻⁶ et [NH₄⁺] ≈ 0,10 mol·L⁻¹.", "À 25 °C, c° = 1 mol·L⁻¹. On pourra utiliser Ka ≈ 6,3 × 10⁻¹⁰ et pKa ≈ 9,2 après les avoir établis.", "Bleu de bromothymol : jaune si pH < 6,0 ; bleu si pH > 7,6.", "Pour le tampon : on mélange n(NH₄⁺) = n(NH₃) = 0,010 mol, puis on ajoute 0,002 mol de H₃O⁺, sans variation appréciable de volume.", "Aide : log(8/12) = log(2/3) ≈ −0,18."], "pka": 9.2, "special": "Cette situation est volontairement simplifiée : les activités et les effets des autres équilibres sont négligés.", "questions": [{"phase": "A · Départ", "question": "Dans le couple NH₄⁺/NH₃, quelle est la forme acide ?", "options": ["NH₃", "NH₄⁺", "H₂O", "HO⁻"], "correct": 1, "explanation": "NH₄⁺ peut céder H⁺ et devenir NH₃. NH₄⁺ est l’acide conjugué, NH₃ la base.", "hint": "Repère celle qui possède un proton H⁺ supplémentaire."}, {"phase": "A · Départ", "question": "Quelle réaction décrit NH₄⁺ dans l’eau ?", "options": ["NH₃ + H₂O → NH₄⁺ + HO⁻", "NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺", "NH₄⁺ + H₃O⁺ → NH₃", "NH₄⁺ → NH₃ + HO⁻"], "correct": 1, "explanation": "L’acide NH₄⁺ donne H⁺ à l’eau : NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺. La transformation est limitée.", "hint": "Écris acide + eau ⇌ base conjuguée + oxonium."}, {"phase": "A · Départ", "question": "À pH = 5,10, combien vaut [H₃O⁺] ?", "options": ["7,9 × 10⁻⁶ mol·L⁻¹", "5,1 mol·L⁻¹", "1,0 × 10⁻¹⁰ mol·L⁻¹", "6,3 × 10⁻¹⁰ mol·L⁻¹"], "correct": 0, "explanation": "[H₃O⁺] = 10⁻⁵·¹⁰ ≈ 7,9 × 10⁻⁶ mol·L⁻¹. La valeur numérique est donnée dans l’énoncé.", "hint": "Utilise 10⁻ᵖᴴ."}, {"phase": "B · Avancement", "question": "Combien de moles de NH₄⁺ y avait-il initialement ?", "options": ["0,0050 mol", "0,050 mol", "0,500 mol", "0,100 mol"], "correct": 1, "explanation": "n₀ = C × V = 0,100 × 0,500 = 0,050 mol.", "hint": "Multiplie concentration initiale et volume en litres."}, {"phase": "B · Avancement", "question": "Quel est l’avancement final xᶠ ?", "options": ["7,9 × 10⁻⁶ mol", "3,95 × 10⁻⁶ mol", "0,050 mol", "3,95 × 10⁻⁵ mol"], "correct": 1, "explanation": "xᶠ ≈ n(H₃O⁺) = [H₃O⁺] × V = 7,9 × 10⁻⁶ × 0,500 = 3,95 × 10⁻⁶ mol.", "hint": "Chaque mole avancée forme une mole de H₃O⁺."}, {"phase": "B · Avancement", "question": "Quel est l’avancement maximal xₘₐₓ ?", "options": ["3,95 × 10⁻⁶ mol", "7,9 × 10⁻⁶ mol", "0,050 mol", "0,500 mol"], "correct": 2, "explanation": "L’eau est en excès : la quantité initiale NH₄⁺ (0,050 mol) fixe xₘₐₓ.", "hint": "Si tout l’acide réagissait, combien de moles pourraient être consommées ?"}, {"phase": "B · Avancement", "question": "Quel est le taux d’avancement final ?", "options": ["7,9 × 10⁻⁵", "7,9 × 10⁻²", "1", "7,9"], "correct": 0, "explanation": "τ = 3,95 × 10⁻⁶ / 0,050 = 7,9 × 10⁻⁵, soit 0,0079 %. Très faible dissociation.", "hint": "τ = xᶠ / xₘₐₓ."}, {"phase": "B · Avancement", "question": "Quelle quantité NH₄⁺ reste-t-il approximativement ?", "options": ["0,050 mol, à 4 × 10⁻⁶ mol près", "0 mol", "3,95 × 10⁻⁶ mol", "0,0050 mol"], "correct": 0, "explanation": "nᶠ(NH₄⁺) = 0,050 − 3,95 × 10⁻⁶ ≈ 0,049996 mol, soit approximativement 0,050 mol.", "hint": "Enlève xᶠ de la quantité initiale."}, {"phase": "B · Avancement", "question": "Quelles concentrations d’équilibre utilise-t-on ?", "options": ["[NH₃] ≈ 0,10 ; [NH₄⁺] ≈ 0", "[NH₃] ≈ 7,9 × 10⁻⁶ ; [NH₄⁺] ≈ 0,10", "[NH₃] ≈ 0,050 ; [NH₄⁺] ≈ 0,050", "[NH₃] ≈ 0 ; [NH₄⁺] ≈ 7,9 × 10⁻⁶"], "correct": 1, "explanation": "[NH₃] = xᶠ/V = 7,9 × 10⁻⁶ mol·L⁻¹ ; [NH₄⁺] = (0,050 − xᶠ)/0,500 ≈ 0,100 mol·L⁻¹.", "hint": "Divise par V ; l’avancement est très petit devant n₀."}, {"phase": "C · Équilibre", "question": "Quelle expression simplifiée de Qᵣ est correcte ?", "options": ["[NH₄⁺]/([NH₃] × [H₃O⁺])", "[NH₃] × [H₃O⁺]/[NH₄⁺]", "[NH₃]/[NH₄⁺]", "[NH₄⁺] × [H₂O]"], "correct": 1, "explanation": "Qᵣ = a(NH₃) × a(H₃O⁺)/a(NH₄⁺) ; l’activité de l’eau vaut 1. La formule en concentrations est ici une écriture simplifiée, c° étant sous-entendue.", "hint": "Mets les produits au numérateur."}, {"phase": "C · Équilibre", "question": "Dans l’état hors équilibre, Qᵣ vaut environ…", "options": ["1,6 × 10⁻¹⁰", "6,3 × 10⁻¹⁰", "1,0 × 10⁻⁴", "0,10"], "correct": 0, "explanation": "Qᵣ ≈ (4,0 × 10⁻⁶)²/0,10 = 1,6 × 10⁻¹⁰.", "hint": "Calcule (4,0 × 10⁻⁶)² puis divise par 0,10."}, {"phase": "C · Équilibre", "question": "Sachant Ka ≈ 6,3 × 10⁻¹⁰, dans quel sens évolue cet état ?", "options": ["Dans le sens inverse", "Dans le sens direct", "Il est à l’équilibre", "On ne peut pas savoir"], "correct": 1, "explanation": "Qᵣ = 1,6 × 10⁻¹⁰ < Ka = 6,3 × 10⁻¹⁰ : le système évolue vers NH₃ et H₃O⁺.", "hint": "Compare Qᵣ à Ka."}, {"phase": "C · Équilibre", "question": "Quelle valeur de Ka trouve-t-on à l’équilibre mesuré ?", "options": ["6,2 × 10⁻¹⁰", "6,2 × 10¹⁰", "7,9 × 10⁻⁶", "0,10"], "correct": 0, "explanation": "Ka ≈ (7,9 × 10⁻⁶)²/0,100 = 6,24 × 10⁻¹⁰, arrondi à 6,2 × 10⁻¹⁰ (c° = 1 mol·L⁻¹ sous-entendu).", "hint": "À l’équilibre, [NH₃] et [H₃O⁺] sont à peu près égales."}, {"phase": "C · Équilibre", "question": "Quel pKa correspond à cet acide ?", "options": ["pKa ≈ 5,1", "pKa ≈ 7,0", "pKa ≈ 9,2", "pKa ≈ 14"], "correct": 2, "explanation": "pKa = −log(Ka) ≈ −log(6,3 × 10⁻¹⁰) ≈ 9,2. C’est le pKa du couple NH₄⁺/NH₃.", "hint": "Le logarithme décimal d’un nombre proche de 10⁻¹⁰ donne environ −9 à −10."}, {"phase": "D · Diagrammes", "question": "À pH = 5,10, quelle forme du couple NH₄⁺/NH₃ prédomine ?", "options": ["NH₃", "NH₄⁺", "Les deux sont à 50 %", "Ni l’une ni l’autre"], "correct": 1, "explanation": "Comme pH 5,10 < pKa 9,2, la forme acide NH₄⁺ prédomine très nettement.", "hint": "Sur l’axe des pH, 5,10 se situe du côté acide."}, {"phase": "D · Diagrammes", "question": "À pH = 10,2, que lirait-on environ sur le diagramme de distribution ?", "options": ["91 % de NH₃ et 9 % de NH₄⁺", "9 % de NH₃ et 91 % de NH₄⁺", "50 % de chaque", "100 % de NH₄⁺"], "correct": 0, "explanation": "pH = pKa + 1 : [NH₃]/[NH₄⁺] = 10, soit NH₃ = 10/11 ≈ 91 % et NH₄⁺ = 1/11 ≈ 9 %.", "hint": "pH − pKa = +1 donc le rapport base/acide vaut 10."}, {"phase": "D · Diagrammes", "question": "Quelle couleur a le BBT dans la première solution à pH = 5,10 ?", "options": ["Bleue", "Verte", "Jaune", "Rose"], "correct": 2, "explanation": "pH 5,10 se situe sous la zone de virage (pH 6,0–7,6) : le BBT est jaune.", "hint": "Compare 5,10 à 6,0."}, {"phase": "E · Tampon", "question": "Dans un tampon où n(NH₄⁺) = n(NH₃) = 0,010 mol, quel est le pH ?", "options": ["5,10", "7,0", "9,2", "10,2"], "correct": 2, "explanation": s d’équilibre.", "hint": "À demi-équivalence les deux formes sont en quantités égales."}, {"phase": "E · Dosage", "question": "Quel est le pH à demi-équivalence ?", "options": ["pH ≈ 3,40", "pH ≈ 7,0", "pH ≈ 4,8", "pH ≈ 8,3"], "correct": 2, "explanation": "À demi-équivalence, [A⁻] ≈ [AH], donc pH = pKa + log(1) ≈ 4,8 : c’est la zone tampon du dosage.", "hint": "Le logarithme du rapport base/acide vaut 0."}, {"phase": "E · Dosage", "question": "Quel indicateur convient le mieux au saut de pH autour de l’équivalence ?", "options": ["Hélianthine (3,1–4,4)", "Phénolphtaléine (8,2–10,0)", "BBT (6,0–7,6)", "Aucun indicateur ne peut convenir"], "correct": 1, "explanation": "La zone 8,2–10,0 de la phénolphtaléine est dans le saut annoncé (7,7–10,2). Pour ce dosage acide faible/base forte, le pH d’équivalence est supérieur à 7.", "hint": "La zone de virage doit être située dans le saut de pH autour de l’équivalence."}, {"phase": "F · Tampon", "question": "À demi-équivalence, on ajoute 2,0 × 10⁻⁵ mol de HO⁻. Quelles quantités obtient-on ?", "options": ["n(AH) = 1,2 × 10⁻⁴ ; n(A⁻) = 0,8 × 10⁻⁴", "n(AH) = 0,8 × 10⁻⁴ ; n(A⁻) = 1,2 × 10⁻⁴", "n(AH) = n(A⁻) = 1,0 × 10⁻⁴", "n(AH) = 0 ; n(A⁻) = 2,0 × 10⁻⁴"], "correct": 1, "explanation": "La base forte HO⁻ consomme AH et forme A⁻ : n(AH) = 1,0 × 10⁻⁴ − 0,2 × 10⁻⁴ = 0,8 × 10⁻⁴ ; n(A⁻) = 1,0 × 10⁻⁴ + 0,2 × 10⁻⁴ = 1,2 × 10⁻⁴ mol.", "hint": "HO⁻ capte H⁺ sur AH : AH diminue et A⁻ augmente."}, {"phase": "F · Tampon", "question": "Avec log(1,5) ≈ 0,18, quel pH final obtient-on ?", "options": ["pH ≈ 4,62", "pH ≈ 4,98 : hausse modérée", "pH ≈ 7,0", "pH ≈ 8,3"], "correct": 1, "explanation": "pH ≈ 4,8 + log((1,2 × 10⁻⁴)/(0,8 × 10⁻⁴)) = 4,8 + log(1,5) ≈ 4,98. La variation est seulement +0,18 : la zone de demi-équivalence est tamponnée.", "hint": "Utilise pH = pKa + log(n(A⁻)/n(AH))."}]}];

  '<circle cx="'+x(0)+'" cy="'+y(50)+'" r="6" fill="#193953"/>'+
  '<g fill="#4d657a" font-family="Arial,sans-serif" font-size="17"><text x="13" y="34">100 %</text><text x="30" y="122">50 %</text><text x="39" y="209">0 %</text><text x="'+(x(-1)-26)+'" y="234">pKa − 1</text><text x="'+(x(0)-38)+'" y="234" font-weight="bold">pKa ≈ '+pka.toFixed(1)+'</text><text x="'+(x(1)-22)+'" y="234">pKa + 1</text></g>'+
  '<g font-family="Arial,sans-serif" font-weight="bold" font-size="18"><text x="90" y="53" fill="#c73d55">AH (acide)</text><text x="520" y="53" fill="#0876ac">A⁻ (base)</text></g></svg><p class="legend">Courbe rouge : forme acide · Courbe bleue : forme basique. Au croisement, pH = pKa.</p></div>';
}
function hIntro(){let c=append(app,'section','card hero','<span class="tag">Terminale spécialité · Chimie</span><h1>🏆 Le final du final — 3 exercices type bac</h1><p class="intro"><strong>60 questions guidées</strong> dans 3 situations complètes. Chaque exercice traverse le chapitre : pH, bilan de matière, xᶠ, τ, Qᵣ/K, Ka/pKa, prédominance, distribution, indicateurs colorés et solutions tampons.</p><p class="muted">4 choix par question, une seule bonne réponse, indice facultatif et correction détaillée à chaque étape. Aucune connexion Internet requise.</p>');
let m=append(c,'div','method');['1 · pH','2 · Avancement','3 · Qᵣ / Ka / pKa','4 · Diagrammes','5 · Indicateur / tampon'].forEach(s=>append(m,'span','',esc(s)));
const results=append(app,'div','card','<h2>Choisir son exercice</h2>');let grid=append(results,'div','menu');
exercises.forEach((e,i)=>{const b=newButton((i+1)+'. '+e.title,()=>switchTo(i),'tile');b.innerHTML='<strong>'+esc(e.title)+'</strong><span>'+esc(e.subtitle)+'</span><span>20 étapes · '+exercises[i].questions.filter((q,j)=>isAnswered(i,j)).length+'/20 déjà validées</span>';grid.appendChild(b);});
const footer=append(app,'div','card','<h2>Comment travailler ?</h2><p>Commencer par les données, garder une feuille et une calculatrice, avancer question par question. Les données restent consultables à tout moment. Les schémas montrent la distribution des deux formes autour du pKa.</p><p><strong>Important :</strong> les trois études constituent un entraînement original « type bac », pas un sujet officiel. Les activités et les effets d’autres équilibres sont négligés quand l’énoncé le précise.</p>');
if(count()){const act=append(footer,'div','actions');act.appendChild(newButton('Voir mon bilan ('+count()+'/'+total+' réponses)',()=>{view='results';render();up()},'primary'));}
}
function hExercise(){const e=exercises[current];const q=step<0?null:e.questions[step];
const h=append(app,'header','card hero','<span class="tag">Exercice '+(current+1)+' / 3</span><h1>'+esc(e.title)+'</h1><p>'+esc(e.subtitle)+'</p>');
const lbl=append(h,'div','progress-label','<span>'+(step<0?'Données de départ':'Étape '+(step+1)+'/20 · '+esc(q.phase))+'</span><span class="num">'+count()+'/'+total+' validées · '+points()+' correctes</span>');
let b=append(h,'div','bar');append(b,'div','').style.width=(100*count()/total)+'%';
if(step<0){const c=append(app,'section','card','<h2>📋 Situation et données</h2><p>'+esc(e.context)+'</p><div class="data-banner"><strong>À noter avant de commencer</strong><ul>'+e.data.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>');
append(c,'div','',graph(e.pka));append(c,'p','muted small',esc(e.special));
const a=append(c,'div','actions');a.appendChild(newButton('Commencer les 20 étapes →',()=>switchTo(current,0),'primary'));a.appendChild(newButton('↩ Retour aux 3 exercices',()=>{view='home';render();up()}));return;}
let c=append(app,'section','card','<div class="steps"><div class="'+(step<3?'active':'')+'">Départ</div><div class="'+(step>=3&&step<9?'active':'')+'">Avancement</div><div class="'+(step>=9&&step<14?'active':'')+'">Équilibre</div><div class="'+(step>=14&&step<17?'active':'')+'">Diagrammes</div><div class="'+(step>=17?'active':'')+'">Applications</div></div><h2>Question '+(step+1)+' / 20</h2><h3>'+esc(q.question)+'</h3>');
const d=append(c,'details','','<summary>📋 Revoir l’énoncé et le diagramme</summary><p>'+esc(e.context)+'</p><ul>'+e.data.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>'+graph(e.pka));
const options=append(c,'div','choices');let validated=isAnswered(current,step);let sel=validated?responses[key(current,step)]:selected;
q.options.forEach((o,i)=>{const b=newButton('ABCD'[i]+'. '+o,()=>{if(validated)return;selected=i;showingHint=false;render()},'choice'+(sel===i?' selected':''));b.disabled=validated;options.appendChild(b)});
if(!validated){let a=append(c,'div','actions');let v=newButton('Valider ma réponse',()=>{if(selected===null)return;responses[key(current,step)]=selected;render()},'primary');v.disabled=selected===null;a.appendChild(v);a.appendChild(newButton(showingHint?'Masquer l’indice':'💡 Voir un indice',()=>{showingHint=!showingHint;render()}));if(showingHint)append(c,'p','data-banner hint','<strong>Indice :</strong> '+esc(q.hint));}
else{const good=sel===q.correct;const f=append(c,'div','feedback '+(good?'correct':'incorrect'),'<strong>'+(good?'✅ Bonne réponse !':'✖ Réponse attendue : '+esc('ABCD'[q.correct]+'. '+q.options[q.correct]))+'</strong><p>'+esc(q.explanation)+'</p>');f.setAttribute('role','status');}
const nav=append(c,'div','actions');if(step>0)nav.appendChild(newButton('← Étape précédente',()=>switchTo(current,step-1)));
if(validated){if(step<19)nav.appendChild(newButton('Étape suivante →',()=>switchTo(current,step+1),'primary'));else nav.appendChild(newButton(current<2?'Exercice suivant →':'Voir le bilan final →',()=>{if(current<2)switchTo(current+1);else{view='results';render();up()}},'primary'));}
nav.appendChild(newButton('↩ Menu',()=>{view='home';render();up()}));
}
function hResults(){append(app,'section','card hero','<h1>📊 Bilan du final du final</h1><p><strong>'+points()+' réponses justes sur '+count()+' réponses validées</strong> · '+total+' étapes au total</p><p class="muted">Ouvre les corrections ci-dessous pour refaire le raisonnement. Tu peux retourner directement à chaque exercice.</p>');
exercises.forEach((e,i)=>{const done=e.questions.filter((q,j)=>isAnswered(i,j)).length;const pts=e.questions.reduce((s,q,j)=>s+(isAnswered(i,j)&&responses[key(i,j)]===q.correct?1:0),0);const card=append(app,'section','card','<h2>'+esc(e.title)+' — '+pts+'/'+done+' justes ('+done+'/20 faites)</h2>');
const a=append(card,'div','actions');a.appendChild(newButton('Revoir cet exercice',()=>switchTo(i), 'primary'));
e.questions.forEach((q,j)=>{let answered=isAnswered(i,j), chosen=responses[key(i,j)],good=answered&&chosen===q.correct;let row=append(card,'details','answerlist','<summary>'+(answered?(good?'✅':'❌'):'▫️')+' '+(j+1)+'. '+esc(q.question)+'</summary><p><strong>Bonne réponse :</strong> '+esc('ABCD'[q.correct]+'. '+q.options[q.correct])+'</p><p>'+esc(q.explanation)+'</p>');if(answered)append(row,'p','muted','Ta réponse : '+esc('ABCD'[chosen]+'. '+q.options[chosen]));});
});let c=append(app,'section','card','');let a=append(c,'div','actions');a.appendChild(newButton('↩ Retour au sommaire',()=>{view='home';render();up()},'primary'));a.appendChild(newButton('Recommencer à zéro',()=>{if(confirm('Effacer toutes les réponses et recommencer les 60 questions ?')){Object.keys(responses).forEach(k=>delete responses[k]);view='home';current=0;step=-1;render();up();}}));}
function render(){app.innerHTML='';if(view==='home')hIntro();else if(view==='results')hResults();else hExercise();append(app,'footer','footer','Révisions de Pauline · Terminale spécialité · 3 exercices originaux type bac · Fichier autonome');}
render();
</script><noscript>Veuillez activer JavaScript pour utiliser ce QCM.</noscript></body></html>
