<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QCM – Équilibre chimique – Terminale</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17243b;background:#f2f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:790px;margin:auto;padding:18px 14px 60px}header{background:linear-gradient(115deg,#dbf1ff,#fff1bc);padding:26px 22px;border-radius:20px;margin-bottom:18px}h1{font-size:clamp(25px,5vw,38px);margin:0 0 9px}p{line-height:1.5}.sub{color:#435d70;margin:0}.progress{display:flex;align-items:center;gap:12px;margin:20px 0}.track{height:12px;background:#d8e7f0;border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;width:0%;background:#168fc2;transition:width .2s}.tag{font-weight:700;color:#205d88;white-space:nowrap}.box{background:#fff;border:1px solid #d5e5f1;border-radius:18px;padding:24px 20px;box-shadow:0 4px 16px #244a6610}.question{font-size:1.22rem;font-weight:750;line-height:1.45;margin:2px 0 18px}.choices{display:grid;gap:10px}.choice{text-align:left;cursor:pointer;border:2px solid #d8e3ed;background:white;border-radius:12px;padding:14px;font:inherit;line-height:1.4;color:#142e42}.choice:hover:not(:disabled){border-color:#2989b4;background:#f5fbff}.choice:disabled{cursor:default}.choice.right{background:#e7f8ee;border-color:#239d5a}.choice.wrong{background:#fff0ee;border-color:#da5550}.feedback{border-radius:12px;margin-top:18px;padding:14px 16px;background:#eef6ff;line-height:1.5;display:none}.feedback.show{display:block}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.primary{background:#087ba9;border:0;color:#fff;padding:12px 22px;border-radius:12px;cursor:pointer;font-size:1rem;font-weight:700}.primary:disabled{background:#9bbac9;cursor:default}.secondary{background:#fff;border:2px solid #86a8bc;color:#1d506c;padding:11px 18px;border-radius:12px;cursor:pointer;font-size:1rem}.summary{text-align:center}.score{font-size:3rem;font-weight:800;color:#097ea8;margin:12px}.review{margin-top:20px;text-align:left}.review article{border-top:1px solid #dde8ed;padding:15px 0}.review strong{display:block;margin-bottom:7px}.good{color:#187c46}.bad{color:#b23b35}.foot{color:#647789;font-size:.88rem;text-align:center;margin:26px 0}button:focus-visible{outline:3px solid #d9a000;outline-offset:2px}
</style></head><body><main><header><h1>⚗️ Équilibre chimique</h1><p class="sub">Modélisation, interprétation et vitesses · Terminale</p><p class="sub">25 questions · 1 seule bonne réponse par question · Correction immédiate et score final</p></header><div class="progress"><div class="track"><div id="fill" class="fill"></div></div><span id="counter" class="tag">1 / 25</span></div><section class="box" id="quiz"><p class="question" id="question"></p><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary" disabled>Question suivante →</button></div></section><section class="box summary" id="result" hidden><h2>🎉 Quiz terminé !</h2><div class="score" id="score"></div><p id="scoreText"></p><button class="primary" onclick="restart()">Recommencer le quiz</button><button class="secondary" onclick="document.getElementById('review').hidden=!document.getElementById('review').hidden">Voir toutes les corrections</button><div id="review" class="review" hidden></div></section><p class="foot">Fiche de révision – Équilibre chimique · Travail autonome</p></main><script>
const questions=[{"q": "Quel est le principe du modèle à deux compartiments ?", "opts": ["Deux compartiments communiquent par une ouverture", "Deux compartiments sont entièrement isolés", "Deux compartiments contiennent obligatoirement les mêmes quantités", "Les deux compartiments représentent deux températures"], "ans": 0, "exp": "L’ouverture permet des passages dans les deux sens, comme les transformations directe et inverse."}, {"q": "Dans le modèle, que contient le compartiment 2 à l’état initial représenté ?", "opts": ["La moitié de la quantité initiale", "Une quantité n₀", "Aucune matière", "Tous les produits à l’équilibre"], "ans": 2, "exp": "Dans le modèle présenté, toute la quantité n₀ est initialement dans le compartiment 1."}, {"q": "Que représentent n₁ et n₂ à l’état d’équilibre ?", "opts": ["Les vitesses des deux réactions", "Les quantités présentes dans chaque compartiment", "Les températures initiale et finale", "Les coefficients stœchiométriques"], "ans": 1, "exp": "n₁ et n₂ désignent les quantités de matière dans les compartiments 1 et 2."}, {"q": "Si presque toute la matière se retrouve dans le compartiment 2, la transformation est…", "opts": ["Très limitée", "Nécessairement impossible", "Totale ou quasi totale", "Toujours plus rapide dans le sens direct à l’équilibre"], "ans": 2, "exp": "Le compartiment 2 illustre ici les produits : une quantité finale presque totale correspond à une transformation totale ou quasi totale."}, {"q": "Dans une transformation avancée mais non totale, à l’équilibre…", "opts": ["Les produits peuvent être majoritaires et des réactifs subsistent", "Tous les réactifs ont disparu", "Seuls les réactifs sont présents", "La réaction inverse s’arrête"], "ans": 0, "exp": "La transformation a beaucoup avancé, sans consommer intégralement les réactifs."}, {"q": "Dans le cas d’une transformation très limitée, quelle composition attend-on ?", "opts": ["Produits seuls", "Réactifs majoritaires", "Réactifs et produits obligatoirement en quantités égales", "Ni réactifs ni produits"], "ans": 1, "exp": "La transformation a peu avancé : les réactifs restent majoritaires."}, {"q": "Dans A + B ⇌ C + D, quel est le sens direct ?", "opts": ["C + D → A + B", "A + B → C + D", "A → B + C + D", "C → A + B + D"], "ans": 1, "exp": "Le sens direct transforme les réactifs A et B en produits C et D."}, {"q": "Dans A + B ⇌ C + D, quel est le sens indirect ?", "opts": ["A + B → C + D", "A + C → B + D", "C + D → A + B", "A + D → B + C"], "ans": 2, "exp": "Le sens indirect reforme les réactifs à partir des produits."}, {"q": "Si on commence avec uniquement A et B, dans quel sens la réaction se produit-elle d’abord ?", "opts": ["Uniquement dans le sens indirect", "Dans le sens direct", "Dans aucun sens", "Obligatoirement à vitesses égales dès la première seconde"], "ans": 1, "exp": "Il n’y a initialement pas de produits C et D pour réagir dans le sens indirect."}, {"q": "Au cours de l’évolution, lorsque les concentrations des réactifs diminuent, que devient en général la vitesse directe ?", "opts": ["Elle diminue", "Elle augmente forcément", "Elle reste toujours constante", "Elle devient négative"], "ans": 0, "exp": "Avec moins de réactifs disponibles, les transformations directes deviennent généralement moins fréquentes."}, {"q": "Lorsque les produits s’accumulent, comment évolue en général la vitesse indirecte ?", "opts": ["Elle devient nulle", "Elle diminue obligatoirement", "Elle augmente", "Elle égale immédiatement la vitesse directe"], "ans": 2, "exp": "La présence croissante de produits favorise les événements de transformation inverse."}, {"q": "Pourquoi parle-t-on d’équilibre « dynamique » ?", "opts": ["Parce que toutes les concentrations oscillent sans cesse", "Parce que les deux transformations continuent en sens opposés", "Parce que la réaction directe seule continue", "Parce que toutes les particules cessent de bouger"], "ans": 1, "exp": "Les transformations continuent dans les deux sens malgré une composition globale stable."}, {"q": "À l’équilibre chimique, quelle relation est correcte ?", "opts": ["v_directe > v_indirecte", "v_directe < v_indirecte", "v_directe = v_indirecte", "v_directe = 0 et v_indirecte = 0 nécessairement"], "ans": 2, "exp": "À un équilibre dynamique, les vitesses directe et inverse sont égales et non nécessairement nulles."}, {"q": "À l’échelle macroscopique, que constate-t-on à l’équilibre dans un système fermé ?", "opts": ["Une composition qui reste constante", "Une disparition régulière des produits", "Une augmentation continue des réactifs", "Une alternance visible obligatoire des deux réactions"], "ans": 0, "exp": "Les concentrations demeurent constantes au cours du temps à l’équilibre."}, {"q": "À l’échelle microscopique, qu’observe-t-on conceptuellement à l’équilibre ?", "opts": ["Une immobilité totale des molécules", "Uniquement des transformations indirectes", "Des transformations directes et indirectes qui se poursuivent", "La disparition des collisions"], "ans": 2, "exp": "Les deux processus se poursuivent simultanément à la même vitesse."}, {"q": "Pendant une même durée, à l’équilibre, que peut-on dire du nombre d’événements directs et indirects dans le modèle A + B ⇌ C + D ?", "opts": ["Il est égal dans les deux sens", "Il est toujours plus grand dans le sens direct", "Il est toujours plus grand dans le sens indirect", "Il est nul dans les deux sens"], "ans": 0, "exp": "La même quantité est transformée dans chaque sens pendant un même intervalle de temps."}, {"q": "À l’équilibre, pendant 1 s, on observe 100 transformations directes. Combien de transformations indirectes ont lieu pendant cette même seconde ?", "opts": ["0", "50", "100", "200"], "ans": 2, "exp": "À l’équilibre, les vitesses égales impliquent ici 100 événements dans chaque sens."}, {"q": "À l’équilibre, il y a plus de produits que de réactifs. Quelle affirmation est correcte ?", "opts": ["La vitesse directe est supérieure à l’indirecte", "La réaction indirecte est arrêtée", "Les vitesses restent égales", "Tous les réactifs ont nécessairement disparu"], "ans": 2, "exp": "La composition à l’équilibre et la comparaison des vitesses sont deux informations distinctes."}, {"q": "Quand les deux vitesses deviennent égales, quelle est la conséquence sur les quantités globales ?", "opts": ["Elles cessent de varier", "Les produits disparaissent", "Les réactifs deviennent toujours majoritaires", "Les deux quantités deviennent forcément égales"], "ans": 0, "exp": "Les effets des deux sens se compensent : il n’y a plus de variation nette."}, {"q": "Dans le modèle, n₂ > n₁ à l’équilibre. Peut-on en conclure que plus de matière passe de 1 vers 2 que l’inverse à cet instant ?", "opts": ["Oui, systématiquement", "Oui, si n₂ vaut le double de n₁", "Non, les flux opposés sont égaux à l’équilibre", "Non, car les passages ont totalement cessé"], "ans": 2, "exp": "Une quantité accumulée supérieure ne signifie pas un flux instantané supérieur."}, {"q": "Quelle phrase distingue correctement « composition » et « vitesse » à l’équilibre ?", "opts": ["La composition décrit les quantités présentes ; les vitesses décrivent les transformations par unité de temps", "La composition et les vitesses sont forcément proportionnelles", "La composition indique combien de réactions se produisent par seconde", "La vitesse indique seulement la quantité finale de matière"], "ans": 0, "exp": "La composition est un état du système ; la vitesse mesure un rythme de transformation."}, {"q": "Le compartiment 2 contient peu de matière à l’équilibre. Cela signifie surtout que…", "opts": ["La transformation vers les produits a été peu avancée", "Il n’existe aucun équilibre", "La vitesse indirecte est supérieure à la vitesse directe à l’équilibre", "Aucune matière n’est jamais passée dans le compartiment 2"], "ans": 0, "exp": "Dans le modèle, le niveau final du compartiment 2 illustre l’avancement vers les produits."}, {"q": "À l’équilibre, quelle proposition décrit le mieux la réaction directe ?", "opts": ["Elle a cessé définitivement", "Elle se poursuit et est compensée par la réaction indirecte", "Elle produit des substances sans aucune consommation", "Elle transforme nécessairement tous les réactifs restants"], "ans": 1, "exp": "L’équilibre est dynamique : chaque sens compense l’autre."}, {"q": "Une transformation n’est pas totale. Quelle conclusion peut-on tirer ?", "opts": ["À l’équilibre, des réactifs peuvent encore être présents", "Les vitesses ne peuvent jamais devenir égales", "La réaction ne peut avoir aucun produit", "Les produits sont toujours majoritaires"], "ans": 0, "exp": "Lors d’une transformation limitée, la consommation des réactifs n’est pas complète."}, {"q": "Quelle affirmation résume le mieux l’équilibre chimique ?", "opts": ["La composition reste stable parce que les transformations opposées se compensent", "La composition reste stable parce que la matière n’a plus aucun mouvement", "Les concentrations de tous les réactifs et produits deviennent égales", "Les produits restent toujours majoritaires"], "ans": 0, "exp": "À l’équilibre, les transformations opposées continuent à même vitesse et le bilan macroscopique est nul."}];let i=0,answers=[];const $=id=>document.getElementById(id);const letters=['A','B','C','D'];function render(){let item=questions[i];$('question').textContent=(i+1)+'. '+item.q;$('counter').textContent=(i+1)+' / '+questions.length;$('fill').style.width=(i/questions.length*100)+'%';$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=i===questions.length-1?'Voir mon résultat →':'Question suivante →';$('choices').replaceChildren();item.opts.forEach((x,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=letters[n]+'. '+x;b.onclick=()=>choose(n);$('choices').appendChild(b)})}function choose(n){if(answers.length>i)return;let item=questions[i];answers.push(n);[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===item.ans)b.classList.add('right');else if(j===n)b.classList.add('wrong')});$('feedback').textContent=(n===item.ans?'✅ Bonne réponse ! ':'❌ Pas tout à fait. ')+item.exp;$('feedback').className='feedback show';$('next').disabled=false}function finish(){$('quiz').hidden=true;$('result').hidden=false;$('fill').style.width='100%';$('counter').textContent='25 / 25';let total=answers.filter((a,j)=>a===questions[j].ans).length;$('score').textContent=total+' / '+questions.length;$('scoreText').textContent=total>=22?'Excellent travail !':total>=17?'Très bien ! Relis les quelques corrections.':total>=12?'Bon début ! Revois les notions à approfondir.':'Relis les fiches et retente le quiz, tu vas progresser !';$('review').replaceChildren();questions.forEach((x,j)=>{let art=document.createElement('article');let title=document.createElement('strong');title.textContent=(j+1)+'. '+x.q;let chosen=document.createElement('div');chosen.className=answers[j]===x.ans?'good':'bad';chosen.textContent='Ta réponse : '+x.opts[answers[j]];let right=document.createElement('div');right.textContent='Bonne réponse : '+x.opts[x.ans];let exp=document.createElement('p');exp.textContent=x.exp;art.append(title,chosen,right,exp);$('review').appendChild(art)})}function restart(){i=0;answers=[];$('review').hidden=true;$('quiz').hidden=false;$('result').hidden=true;render()}$('next').onclick=()=>{if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()};render();
</script></body></html>
