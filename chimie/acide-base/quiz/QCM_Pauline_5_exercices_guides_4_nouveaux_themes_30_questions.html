const exercises=[{"title": "Diagramme de prédominance : qui est majoritaire ?", "subtitle": "Lire les zones AH / A⁻, puis utiliser le rapport des concentrations.", "goal": "Décider quelle forme prédomine et retrouver des concentrations.", "diagram": "predominance", "data": ["Couple acide éthanoïque / ion éthanoate : CH₃COOH / CH₃COO⁻ (noté AH / A⁻).", "pKₐ du couple = 4,8.", "On étudie successivement des solutions de pH 3,8 ; 4,8 ; puis 5,8.", "Relation disponible : pH = pKₐ + log([A⁻]/[AH]).", "Dans la dernière question, [AH] + [A⁻] = 0,011 mol·L⁻¹, pour la solution de pH 5,8."], "qs": [["Sur le diagramme, quelle valeur marque la limite entre les deux domaines ?", ["pH = 7", "pH = pKₐ = 4,8", "pH = pKₐ + 2", "pH = 0"], 1, "La frontière est pH = pKₐ = 4,8. À cette valeur, les deux formes ont la même concentration."], ["À pH = 3,8, quelle espèce est majoritaire ?", ["CH₃COO⁻ (A⁻)", "Les deux sont à égalité", "CH₃COOH (AH)", "Aucune des deux"], 2, "3,8 < 4,8 : à gauche du pKₐ, c’est la forme acide AH qui prédomine."], ["Toujours à pH = 3,8, quel est le rapport [A⁻]/[AH] ?", ["10", "1", "0,01", "0,10"], 3, "pH − pKₐ = −1, donc log([A⁻]/[AH]) = −1 et [A⁻]/[AH] = 10⁻¹ = 0,10."], ["Imaginons maintenant pH = 4,8. Que devient le rapport [A⁻]/[AH] ?", ["0", "10", "1", "100"], 2, "À pH = pKₐ, log(r) = 0 ; donc r = 1 et [A⁻] = [AH]."], ["Imaginons ensuite pH = 5,8. Quelle affirmation est juste ?", ["AH est dix fois plus concentré", "A⁻ est dix fois plus concentré", "Les formes sont égales", "A⁻ a disparu"], 1, "pH − pKₐ = +1 : [A⁻]/[AH] = 10. La base A⁻ est dix fois plus concentrée que l’acide AH."], ["À pH = 5,8, sachant [AH] + [A⁻] = 0,011 mol·L⁻¹, quelles sont les concentrations ?", ["[AH] = 0,010 ; [A⁻] = 0,001", "[AH] = 0,0055 ; [A⁻] = 0,0055", "[AH] = 0,001 ; [A⁻] = 0,010", "[AH] = 0,011 ; [A⁻] = 0"], 2, "Avec [A⁻] = 10[AH], on a 11[AH] = 0,011. Donc [AH] = 0,001 mol·L⁻¹ et [A⁻] = 0,010 mol·L⁻¹."]]}, {"title": "Diagramme de distribution : lire les pourcentages", "subtitle": "Observer les courbes, repérer leur intersection, puis calculer.", "goal": "Lire les proportions des deux formes d’un couple acide/base.", "diagram": "distribution", "data": ["Même couple AH / A⁻ de pKₐ = 4,8.", "Courbe rouge : pourcentage de AH ; courbe bleue : pourcentage de A⁻.", "Les pourcentages des deux formes totalisent 100 %.", "À pH = pKₐ − 1, environ 91 % de AH ; à pH = pKₐ + 1, environ 91 % de A⁻.", "Pour la dernière question, [AH] + [A⁻] = 0,020 mol·L⁻¹ à pH 5,8."], "qs": [["Sur un diagramme de distribution, que représentent les deux axes ?", ["Horizontal : temps ; vertical : masse", "Horizontal : pH ; vertical : pourcentage", "Horizontal : pKₐ ; vertical : température", "Horizontal : concentration ; vertical : volume"], 1, "L’axe horizontal indique le pH. L’axe vertical donne la proportion (en %) de chaque forme du couple."], ["Quand le pH augmente, que fait la courbe rouge de AH ?", ["Elle augmente vers 100 %", "Elle reste à 50 %", "Elle diminue vers 0 %", "Elle devient négative"], 2, "En milieu plus basique, AH cède davantage son proton : sa proportion diminue et celle de A⁻ augmente."], ["Au point où les deux courbes se croisent, quelle relation est vraie ?", ["pH = 7 forcément", "pH = pKₐ = 4,8", "pH = 0", "pH = 2 × pKₐ"], 1, "L’intersection correspond à 50 % de AH et 50 % de A⁻, donc [A⁻] = [AH] et pH = pKₐ."], ["À pH = 3,8, quelle lecture du graphique est cohérente ?", ["91 % de AH et 9 % de A⁻", "9 % de AH et 91 % de A⁻", "50 % de chaque forme", "100 % de A⁻"], 0, "3,8 = 4,8 − 1 : la forme acide représente environ 91 %, et la base environ 9 %."], ["À pH = 5,8, quelle lecture du graphique est cohérente ?", ["91 % de AH et 9 % de A⁻", "50 % de chaque forme", "9 % de AH et 91 % de A⁻", "0 % des deux formes"], 2, "5,8 = 4,8 + 1 : la forme basique représente environ 91 %, et l’acide environ 9 %."], ["À pH 5,8, la concentration totale vaut 0,020 mol·L⁻¹. En arrondissant à 90 % / 10 %, quelles concentrations obtient-on ?", ["[AH] ≈ 0,018 ; [A⁻] ≈ 0,002", "[AH] ≈ 0,010 ; [A⁻] ≈ 0,010", "[AH] ≈ 0,020 ; [A⁻] ≈ 0", "[AH] ≈ 0,002 ; [A⁻] ≈ 0,018"], 3, "En arrondissant : [A⁻] ≈ 0,90 × 0,020 = 0,018 mol·L⁻¹ et [AH] ≈ 0,10 × 0,020 = 0,002 mol·L⁻¹."]]}, {"title": "Indicateurs colorés : prévoir une couleur", "subtitle": "Comprendre la zone de virage et choisir un indicateur de dosage.", "goal": "Relier le pH, la forme dominante de l’indicateur et la couleur observée.", "diagram": "indicator", "data": ["Un indicateur coloré est un couple acide/base dont les deux formes ont des couleurs différentes.", "Bleu de bromothymol (BBT) : jaune en milieu acide, bleu en milieu basique, vert dans sa zone de virage.", "Pour cet exercice, la zone de virage du BBT est approximativement pH 6,0 à 7,6.", "Hélianthine : rouge en milieu acide et jaune en milieu basique.", "Phénolphtaléine : incolore en milieu acide et rose en milieu basique.", "Un dosage fictif a un pH à l’équivalence voisin de 7, avec un saut de pH autour de cette valeur."], "qs": [["Pourquoi un indicateur coloré peut-il changer de couleur ?", ["Parce que son volume change", "Parce que ses formes acide et basique n’ont pas la même couleur", "Parce qu’il contient toujours du chlore", "Parce qu’il devient forcément solide"], 1, "Un indicateur est lui-même un couple acide/base (HIn/In⁻) : ses deux formes présentent des teintes différentes."], ["On ajoute du BBT à une solution de pH = 4. Quelle couleur prévoit-on ?", ["Bleu", "Vert", "Jaune", "Rose"], 2, "pH 4 est en dessous de la zone de virage du BBT (environ 6,0 à 7,6) : sa forme acide, jaune, domine."], ["Imaginons maintenant pH = 7. Quelle teinte du BBT attend-on approximativement ?", ["Verte", "Rouge", "Rose", "Incolore"], 0, "pH 7 se trouve dans la zone de virage du BBT : le mélange des teintes donne une coloration verte."], ["Et dans une solution de pH = 9 ?", ["Jaune", "Verte", "Incolore", "Bleue"], 3, "pH 9 est au-dessus de la zone de virage : la forme basique du BBT, bleue, prédomine."], ["On réalise un dosage dont l’équivalence est voisine de pH 7. Parmi ces indicateurs, lequel choisirais-tu ?", ["Phénolphtaléine (zone basique)", "BBT (zone autour de 7)", "Hélianthine (zone acide)", "N’importe lequel, sans vérifier"], 1, "Le BBT vire près de pH 7 : sa zone de virage peut se situer dans le saut de pH autour de l’équivalence."], ["Quelle règle générale justifie le choix d’un indicateur lors d’un dosage ?", ["Choisir la couleur la plus vive", "Prendre systématiquement le BBT", "Choisir une zone de virage située dans le saut de pH à l’équivalence", "Choisir l’indicateur le moins cher"], 2, "On choisit un indicateur dont la zone de virage est comprise dans le saut de pH observé au voisinage de l’équivalence."]]}, {"title": "Solution tampon : que se passe-t-il si on ajoute un acide ?", "subtitle": "Partir du mélange, suivre la réaction, puis estimer le nouveau pH.", "goal": "Expliquer pourquoi le pH d’une solution tampon varie peu.", "diagram": "buffer", "data": ["Couple AH / A⁻ (acide éthanoïque / éthanoate) ; pKₐ = 4,8.", "On prépare un mélange contenant n(AH) = 0,10 mol et n(A⁻) = 0,10 mol, dans un volume supposé constant.", "On ajoute ensuite 0,010 mol de H₃O⁺, qui réagit totalement avec A⁻.", "Formule : pH = pKₐ + log([A⁻]/[AH]). À volume égal, le rapport des concentrations est celui des quantités.", "Aide pour le dernier calcul : log(9/11) ≈ −0,09."], "qs": [["Pourquoi ce mélange peut-il jouer le rôle de solution tampon ?", ["Il contient seulement de l’eau", "Il contient un acide faible et sa base conjuguée en quantités voisines", "Il a obligatoirement pH = 7", "Il ne contient aucun ion"], 1, "Une solution tampon contient habituellement un acide faible AH et sa base conjuguée A⁻, tous deux présents en quantités significatives."], ["Quel est le pH avant l’ajout, lorsque n(AH) = n(A⁻) ?", ["3,8", "7,0", "4,8", "5,8"], 2, "Le rapport [A⁻]/[AH] vaut 1, donc log(1) = 0. Ainsi pH = pKₐ = 4,8."], ["Quand on ajoute H₃O⁺, quelle réaction limite l’acidification ?", ["AH + H₃O⁺ → A⁻ + H₂O", "A⁻ + H₃O⁺ → AH + H₂O", "AH + A⁻ → H₃O⁺", "H₂O → AH + A⁻"], 1, "La base conjuguée A⁻ capte les ions H₃O⁺ apportés et se transforme en AH."], ["Après l’ajout de 0,010 mol de H₃O⁺, quelles quantités obtient-on ?", ["n(AH) = 0,11 ; n(A⁻) = 0,09 mol", "n(AH) = 0,09 ; n(A⁻) = 0,11 mol", "n(AH) = 0,10 ; n(A⁻) = 0,10 mol", "n(AH) = 0,11 ; n(A⁻) = 0,11 mol"], 0, "La réaction consomme 0,010 mol de A⁻ et forme 0,010 mol de AH : 0,10 + 0,010 = 0,11 et 0,10 − 0,010 = 0,09 mol."], ["Quel rapport [A⁻]/[AH] faut-il maintenant utiliser ?", ["11/9", "1", "9/11", "9"], 2, "À volume constant, [A⁻]/[AH] = n(A⁻)/n(AH) = 0,09/0,11 = 9/11."], ["Avec log(9/11) ≈ −0,09, quel pH trouve-t-on et qu’en conclut-on ?", ["pH ≈ 7 : il augmente beaucoup", "pH ≈ 3,8 : il baisse de 1", "pH ≈ 4,8 : il ne change rigoureusement jamais", "pH ≈ 4,71 : il baisse légèrement"], 3, "pH ≈ 4,8 − 0,09 = 4,71. Malgré l’ajout d’acide, le pH ne baisse que légèrement : c’est l’effet tampon."]]}, {"title": "Exercice-bilan : tout relier dans une solution", "subtitle": "Prédominance, distribution, indicateur et tampon dans une même situation.", "goal": "Enchaîner les quatre notions comme dans un exercice de bac.", "diagram": "summary", "data": ["On prépare V = 1,0 L d’un mélange AH / A⁻, pKₐ = 4,8, à pH initial = 4,8.", "Concentration totale initiale : [AH] + [A⁻] = 0,020 mol·L⁻¹.", "On ajoute quelques gouttes de BBT (jaune si pH < 6 ; vert dans sa zone de virage).", "Ensuite, on ajoute 0,002 mol de HO⁻ : la transformation AH + HO⁻ → A⁻ + H₂O est supposée totale.", "Le volume total est supposé rester 1,0 L.", "Formule : pH = pKₐ + log([A⁻]/[AH]) ; aide : log(1,5) ≈ 0,18."], "qs": [["Au départ, pH = pKₐ = 4,8. Que lis-tu sur les diagrammes de prédominance et de distribution ?", ["AH prédomine à 100 %", "Les deux formes sont à 50 % / 50 %", "A⁻ prédomine à 100 %", "Aucune forme n’est présente"], 1, "À pH = pKₐ, les concentrations sont égales ; le diagramme de distribution donne 50 % de chaque forme."], ["La concentration totale vaut 0,020 mol·L⁻¹. Quelles sont les concentrations initiales ?", ["[AH] = [A⁻] = 0,020", "[AH] = 0,019 ; [A⁻] = 0,001", "[AH] = [A⁻] = 0,010", "[AH] = 0 ; [A⁻] = 0,020"], 2, "À 50/50 : 0,020/2 = 0,010 mol·L⁻¹ pour chacune des deux formes."], ["On ajoute quelques gouttes de BBT à cette solution de pH 4,8. Quelle couleur voit-on ?", ["Jaune", "Verte", "Bleue", "Rose"], 0, "À pH 4,8, le BBT est en dessous de sa zone de virage : il est jaune."], ["On ajoute 0,002 mol de HO⁻. Quelle espèce du tampon réagit ?", ["A⁻, qui devient AH", "L’indicateur coloré uniquement", "AH, qui devient A⁻", "Ni AH ni A⁻"], 2, "L’acide faible AH neutralise les ions HO⁻ : AH + HO⁻ → A⁻ + H₂O."], ["Après cette réaction, quelles quantités de AH et A⁻ reste-t-il dans 1,0 L ?", ["n(AH) = 0,012 et n(A⁻) = 0,008 mol", "n(AH) = 0,008 et n(A⁻) = 0,012 mol", "n(AH) = n(A⁻) = 0,010 mol", "n(AH) = 0 et n(A⁻) = 0,020 mol"], 1, "Initialement chaque forme représente 0,010 mol. On consomme 0,002 mol de AH et on forme autant de A⁻ : 0,008 et 0,012 mol."], ["Avec log(1,5) ≈ 0,18, quel pH final obtiens-tu ?", ["pH ≈ 7,0 : forte hausse", "pH ≈ 4,0 : baisse", "pH ≈ 4,8 : inchangé exactement", "pH ≈ 4,98 : légère hausse"], 3, "[A⁻]/[AH] = 0,012/0,008 = 1,5 ; pH = 4,8 + log(1,5) ≈ 4,98. Le tampon limite la variation de pH."]]}];

let ei=0,qi=-1,selected=null,validated=false,score=0,answers={},view='home';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(i,j)=>i+'-'+j;
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b;}
function pageTop(){window.scrollTo(0,0)}
function answered(i){let n=0;for(let j=0;j<6;j++){if(Object.hasOwn(answers,key(i,j)))n++}return n;}
function renderHome(){view='home';app.innerHTML='';let c=document.createElement('div');c.className='card hero';c.innerHTML='<div class="eyebrow">Terminale spécialité · Acides et bases</div><h1>🧪 5 nouveaux exercices guidés</h1><p><b>30 questions</b> · 4 choix · 1 bonne réponse · correction expliquée après chaque étape.</p><p>Les 4 nouveaux thèmes : prédominance, distribution, indicateurs colorés, solutions tampons. Le 5ᵉ exercice les rassemble.</p><p class="muted small">Comme dans les exercices guidés précédents : garde une feuille pour les calculs. Les informations restent accessibles pendant le quiz.</p>';app.append(c);
let menu=document.createElement('div');menu.className='card';menu.innerHTML='<h2>Choisis un exercice</h2><p class="muted small">Tu peux les faire dans l’ordre, ou aller directement sur le thème qui t’intéresse.</p>';const buttons=document.createElement('div');buttons.className='exercise-buttons';menu.append(buttons);exercises.forEach((e,i)=>{const b=btn((i+1)+'. '+e.title,()=>{ei=i;qi=-1;selected=null;validated=false;renderExercise();pageTop();});let s=document.createElement('small');s.textContent='6 questions · '+e.subtitle;b.append(s);buttons.append(b);});app.append(menu);
if(Object.keys(answers).length){let s=document.createElement('div');s.className='card';s.innerHTML='<b>Progression :</b> '+Object.keys(answers).length+'/30 questions validées · '+score+' bonne(s) réponse(s).';s.append(btn('Voir mon bilan',()=>{renderResults();pageTop()},'primary'));app.append(s)}
let f=document.createElement('div');f.className='footer';f.textContent='Révisions de Pauline · Exercice autonome · Aucun compte nécessaire';app.append(f);
}
function renderExercise(){view='exercise';app.innerHTML='';const e=exercises[ei];const head=document.createElement('div');head.className='card hero';head.innerHTML='<div class="eyebrow">Exercice '+(ei+1)+'/5 · '+(qi<0?'Données de départ':'Étape '+(qi+1)+'/6')+'</div><h1>🧪 Exercices guidés · 4 nouvelles notions</h1><p class="muted">'+score+'/30 bonnes réponses (pour les questions déjà validées)</p><div class="bar"><div style="width:'+Math.round(Object.keys(answers).length/30*100)+'%"></div></div>';app.append(head);
let card=document.createElement('section');card.className='card';app.append(card);
if(qi<0){card.innerHTML='<h2>'+esc(e.title)+'</h2><p>'+esc(e.subtitle)+'</p><p><strong>Objectif :</strong> '+esc(e.goal)+'</p><div class="figure">'+diagrams[e.diagram]+'</div><h3>📋 Situation et données</h3><ul>'+e.data.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="note small"><b>Astuce :</b> note les données sur une feuille avant de commencer. Les 6 questions suivent le même raisonnement et les corrections expliquent chaque étape.</p>';
const act=document.createElement('div');act.className='actions';act.append(btn('Commencer les 6 questions →',()=>{qi=0;selected=null;validated=false;renderExercise();pageTop()},'primary'));act.append(btn('↩ Choisir un autre exercice',()=>{renderHome();pageTop()}));card.append(act);return;}
const q=e.qs[qi];card.innerHTML='<h2>'+esc(e.title)+'</h2><details><summary>📋 Revoir les données et le schéma</summary><div class="figure">'+diagrams[e.diagram]+'</div><ul>'+e.data.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details><h3>Question '+(qi+1)+' — '+esc(q[0])+'</h3>';
const opts=document.createElement('div');opts.className='answers';card.append(opts);
q[1].forEach((choice,k)=>{const b=btn('ABCD'[k]+'. '+choice,()=>{if(validated)return;selected=k;renderExercise()},selected===k?'selected':'');b.disabled=validated;opts.append(b)});
if(validated){const isGood=selected===q[2];const feed=document.createElement('div');feed.className='feedback '+(isGood?'good':'bad');feed.setAttribute('role','status');feed.innerHTML='<strong>'+(isGood?'✓ Bonne réponse !':'✗ Bonne réponse : '+esc('ABCD'[q[2]]+'. '+q[1][q[2]]))+'</strong><p>'+esc(q[3])+'</p>';card.append(feed);
const act=document.createElement('div');act.className='actions';act.append(btn(qi===5?(ei===4?'Voir le bilan →':'Passer au prochain exercice →'):'Question suivante →',()=>{if(qi===5){if(ei===4){renderResults();pageTop();return;}ei++;qi=-1}else{qi++;}selected=null;validated=false;renderExercise();pageTop()},'primary'));act.append(btn('↩ Menu des exercices',()=>{renderHome();pageTop()}));card.append(act);
}else{const act=document.createElement('div');act.className='actions';const v=btn('Valider ma réponse',()=>{if(selected===null)return;validated=true;if(Object.hasOwn(answers,key(ei,qi)) && answers[key(ei,qi)]===q[2])score--;answers[key(ei,qi)]=selected;if(selected===q[2])score++;renderExercise();},'primary');v.disabled=selected===null;act.append(v);act.append(btn('↩ Menu des exercices',()=>{renderHome();pageTop()}));card.append(act)}
}
function renderResults(){view='results';app.innerHTML='<div class="card hero"><h1>🎉 Bilan des 5 exercices guidés</h1><p><strong>Score obtenu : '+score+'/30</strong> · '+Math.round(score/30*100)+' % si toutes les questions sont faites.</p><p class="muted">Les corrections de chaque étape sont reprises ci-dessous. Tu peux consulter les réponses sans effacer ton travail.</p></div>';
exercises.forEach((e,i)=>{let correct=0,answeredCount=0;const rows=e.qs.map((q,j)=>{if(!Object.hasOwn(answers,key(i,j)))return '<details><summary>Question '+(j+1)+' · Non faite — '+esc(q[0])+'</summary><p>'+esc(q[3])+'</p></details>';answeredCount++;const chosen=answers[key(i,j)],good=chosen===q[2];if(good)correct++;return '<details><summary>Question '+(j+1)+' · '+(good?'✓':'✗')+' '+esc(q[0])+'</summary><p>Ta réponse : '+esc(q[1][chosen])+'</p><p>Bonne réponse : '+esc(q[1][q[2]])+'</p><p>'+esc(q[3])+'</p></details>'}).join('');let card=document.createElement('section');card.className='card';card.innerHTML='<h2>'+(i+1)+'. '+esc(e.title)+' : '+correct+'/'+answeredCount+' bonne(s) réponse(s)</h2>'+rows;app.append(card)});
let c=document.createElement('div');c.className='card actions';c.append(btn('↩ Choisir un exercice',()=>{renderHome();pageTop()},'primary'));c.append(btn('Recommencer à zéro',()=>{if(!confirm('Effacer les réponses et recommencer les 30 questions ?'))return;ei=0;qi=-1;selected=null;validated=false;answers={};score=0;renderHome();pageTop()}));app.append(c);
}
renderHome();
</script></body></html>
